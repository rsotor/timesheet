name: Bug report
description: Something does not work as described in the README.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real data**: no API keys, tokens, IDs, company subdomains or emails.
        Replace them with `xxxx` before submitting.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Command you ran and the output you got (with real data removed).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and Python version
      placeholder: macOS 15, Python 3.14
    validations:
      required: true
