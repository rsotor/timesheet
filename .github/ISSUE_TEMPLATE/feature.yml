name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "**Never paste real data**: no API keys, tokens, IDs, company subdomains or emails."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you need to do that the tool does not allow today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
