name: Release

# release-please keeps a "chore: release X.Y.Z" PR open with the CHANGELOG up to date.
# Merging it creates the vX.Y.Z tag and the GitHub Release with its notes.
# Its CI waits until a maintainer clicks "Approve workflows and run" on the PR
# (GitHub treats the bot as an external contributor). See CONTRIBUTING.md.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
