# Dependency updates.
# - Once a week, a single PR with all MINOR and PATCH updates (compatible).
# - Security fixes also arrive grouped in a single PR, as soon as an advisory is published.
# - MAJOR versions do not arrive as automatic PRs: they can break things and are done by hand,
#   tested. Security alerts still show up in the Security tab.
# - Python updates are titled "build(deps): ..." so they show up in the CHANGELOG under
#   "Dependencies and maintenance"; Action updates are "ci(deps): ..." and stay hidden.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    commit-message:
      prefix: build
      include: scope
    groups:
      python-minor:
        applies-to: version-updates
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
